name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Required for:
# - GitHub OIDC → AWS
# - cosign keyless image signing
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devsecops-app

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # 2. SET UP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      # ============================================================
      # 4. PYTHON DEPENDENCY SECURITY SCAN
      # ============================================================
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit || true


      # ============================================================
      # 5. SAST - BANDIT
      #
      # Security gate:
      # - -ll = report medium severity and above
      # - No || true
      # - Failure blocks the pipeline
      # ============================================================
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . -x ./.venv -ll


      # ============================================================
      # 6. TRIVY FILESYSTEM SECURITY SCAN
      #
      # Security gate:
      # - HIGH and CRITICAL vulnerabilities
      # - exit-code 1 means pipeline fails
      # ============================================================
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


      # ============================================================
      # 7. BUILD DOCKER IMAGE
      # ============================================================
      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-app:latest \
            .


      # ============================================================
      # 8. TRIVY CONTAINER SECURITY SCAN
      #
      # Security gate:
      # - HIGH and CRITICAL vulnerabilities
      # - .trivyignore is respected
      # - exit-code 1 blocks pipeline
      # ============================================================
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: 1


      # ============================================================
      # 9. GITHUB OIDC DIAGNOSTICS
      #
      # Prints non-sensitive OIDC claims.
      # JWT itself is NEVER printed.
      # ============================================================
      - name: Debug GitHub OIDC
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -e

          echo "=========================================="
          echo "GitHub Actions OIDC Diagnostics"
          echo "=========================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref:        $GITHUB_REF"
          echo "Event:      $GITHUB_EVENT_NAME"
          echo "Workflow:   $GITHUB_WORKFLOW"
          echo "Actor:      $GITHUB_ACTOR"

          echo ""
          echo "Requesting GitHub OIDC token..."

          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not obtain GitHub OIDC token"
            exit 1
          fi

          echo "OIDC token successfully obtained."
          echo "Token length: ${#TOKEN}"

          echo ""
          echo "Decoding non-sensitive OIDC claims..."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          if [ -z "$CLAIMS" ]; then
            echo "::error::Could not decode OIDC token payload"
            exit 1
          fi

          echo ""
          echo "OIDC claims:"

          echo "$CLAIMS" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            repository_id,
            repository_visibility,
            ref,
            sha,
            event_name,
            actor,
            workflow,
            job_workflow_ref
          }'

          echo ""
          echo "Expected IAM audience:"
          echo "aud = sts.amazonaws.com"

          echo ""
          echo "OIDC diagnostics completed."


      # ============================================================
      # 10. CONFIGURE AWS CREDENTIALS USING GITHUB OIDC
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions
          audience: sts.amazonaws.com


      # ============================================================
      # 11. VERIFY AWS IDENTITY
      # ============================================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ============================================================
      # 12. LOGIN TO AMAZON ECR
      # ============================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 13. TAG DOCKER IMAGE FOR ECR
      # ============================================================
      - name: Tag Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            devsecops-app:latest \
            $REGISTRY/${ECR_REPOSITORY}:latest


      # ============================================================
      # 14. PUSH IMAGE TO ECR
      #
      # ECR scan-on-push must be enabled separately in AWS.
      # ============================================================
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $REGISTRY/${ECR_REPOSITORY}:latest


      # ============================================================
      # 15. INSTALL COSIGN
      #
      # Keyless signing uses OIDC.
      # No private signing key is stored in GitHub Secrets.
      # ============================================================
      - name: Install cosign
        uses: sigstore/cosign-installer@v3


      # ============================================================
      # 16. SIGN ECR IMAGE WITH COSIGN
      #
      # Keyless signing:
      # GitHub Actions OIDC
      #        ↓
      # Sigstore/Fulcio
      #        ↓
      # Signed container image
      # ============================================================
      - name: Sign container image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPOSITORY}:latest"

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE")

          if [ -z "$DIGEST" ]; then
            echo "::error::Could not determine pushed image digest"
            exit 1
          fi

          echo "Signing image:"
          echo "$DIGEST"

          cosign sign --yes "$DIGEST"


      # ============================================================
      # 17. START APPLICATION FOR DAST
      #
      # Dockerfile exposes port 5001.
      # Host port 5001 → container port 5001.
      # ============================================================
      - name: Start application
        run: |
          docker run -d \
            --name devsecops-app \
            -p 5001:5001 \
            devsecops-app:latest

          echo "Waiting for application to become healthy..."

          for i in {1..30}; do

            if curl -fsS http://localhost:5001/health; then
              echo ""
              echo "Application is healthy."
              exit 0
            fi

            if [ "$i" -eq 30 ]; then
              echo "::error::Application failed to become healthy"

              echo ""
              echo "Container logs:"
              docker logs devsecops-app

              exit 1
            fi

            echo "Attempt $i/30 - application not ready yet."

            sleep 2

          done


      # ============================================================
      # 18. OWASP ZAP DAST SECURITY GATE
      #
      # Scans the running Flask application.
      # fail_action: true makes ZAP findings fail the job.
      # ============================================================
      - name: Run OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:5001"
          fail_action: true
          allow_issue_writing: false


      # ============================================================
      # 19. CLEANUP
      #
      # Always runs, including when ZAP or another security gate fails.
      # ============================================================
      - name: Cleanup application container
        if: always()
        run: |
          docker rm -f devsecops-app 2>/dev/null || true
