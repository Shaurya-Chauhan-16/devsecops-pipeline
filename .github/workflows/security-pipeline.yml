name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devsecops-app

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ------------------------------------------------------------
      # 4. Python dependency security scan
      # ------------------------------------------------------------
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

      # ------------------------------------------------------------
      # 5. SAST - Bandit
      # ------------------------------------------------------------
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . -x ./.venv -ll

      # ------------------------------------------------------------
      # 6. Trivy filesystem scan
      # ------------------------------------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # ------------------------------------------------------------
      # 7. Build Docker image
      # ------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t devsecops-app:latest .

      # ------------------------------------------------------------
      # 8. Trivy container security gate
      # ------------------------------------------------------------
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: 1

      # ------------------------------------------------------------
      # 9. GitHub OIDC diagnostics
      # ------------------------------------------------------------
      - name: Debug GitHub OIDC
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -e

          echo "=========================================="
          echo "GitHub Actions OIDC Diagnostics"
          echo "=========================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref:        $GITHUB_REF"
          echo "Event:      $GITHUB_EVENT_NAME"
          echo "Workflow:   $GITHUB_WORKFLOW"
          echo "Actor:      $GITHUB_ACTOR"

          echo ""
          echo "Requesting GitHub OIDC token..."

          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not obtain GitHub OIDC token"
            exit 1
          fi

          echo "OIDC token successfully obtained."
          echo "Token length: ${#TOKEN}"

          echo ""
          echo "Decoding non-sensitive OIDC claims..."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          if [ -z "$CLAIMS" ]; then
            echo "::error::Could not decode OIDC token payload"
            exit 1
          fi

          echo ""
          echo "OIDC claims:"

          echo "$CLAIMS" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            repository_id,
            repository_visibility,
            ref,
            sha,
            event_name,
            actor,
            workflow,
            job_workflow_ref
          }'

          echo ""
          echo "Expected IAM trust values:"
          echo "aud = sts.amazonaws.com"
          echo "sub = GitHub repository subject configured in IAM"

      # ------------------------------------------------------------
      # 10. Configure AWS credentials using GitHub OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions
          audience: sts.amazonaws.com

      # ------------------------------------------------------------
      # 11. Verify AWS identity
      # ------------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # 12. Enable / verify ECR scan-on-push
      # ------------------------------------------------------------
      - name: Verify ECR scan-on-push
        run: |
          aws ecr put-image-scanning-configuration \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].imageScanningConfiguration'

      # ------------------------------------------------------------
      # 13. Login to Amazon ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # 14. Tag Docker image
      # ------------------------------------------------------------
      - name: Tag Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            devsecops-app:latest \
            $REGISTRY/${ECR_REPOSITORY}:latest

      # ------------------------------------------------------------
      # 15. Push Docker image to ECR
      # ------------------------------------------------------------
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $REGISTRY/${ECR_REPOSITORY}:latest

      # ------------------------------------------------------------
      # 16. Start application for DAST
      # ------------------------------------------------------------
      - name: Start application
        run: |
          docker run -d \
            --name devsecops-app \
            -p 5001:5001 \
            devsecops-app:latest

          echo "Waiting for application to become healthy..."

          for i in {1..30}; do
            if curl -fsS http://localhost:5001/health; then
              echo ""
              echo "Application is healthy."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "::error::Application failed to become healthy"
              docker logs devsecops-app
              exit 1
            fi

            sleep 2
          done

          echo ""
          echo "Testing application endpoints..."

          curl -fsS http://localhost:5001/
          echo ""

          curl -fsS http://localhost:5001/health
          echo ""

      # ------------------------------------------------------------
      # 17. OWASP ZAP DAST security gate
      # ------------------------------------------------------------
      - name: Run OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:5001"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: ".zap/rules.tsv"

      # ------------------------------------------------------------
      # 18. Install Cosign
      # ------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ------------------------------------------------------------
      # 19. Sign container image using keyless signing
      # ------------------------------------------------------------
      - name: Sign container image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPOSITORY}:latest"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::Could not retrieve ECR image digest"
            exit 1
          fi

          echo "Image digest: $DIGEST"
          echo "Signing: $IMAGE@$DIGEST"

          cosign sign --yes "$IMAGE@$DIGEST"

      # ------------------------------------------------------------
      # 20. Cleanup
      # ------------------------------------------------------------
      - name: Cleanup application container
        if: always()
        run: |
          docker rm -f devsecops-app 2>/dev/null || true