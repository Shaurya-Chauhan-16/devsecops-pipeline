name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devsecops-app

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ------------------------------------------------------------
      # 4. Python dependency security scan
      # ------------------------------------------------------------
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

      # ------------------------------------------------------------
      # 5. Bandit security scan
      # ------------------------------------------------------------
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . -x ./.venv || true

      # ------------------------------------------------------------
      # 6. Trivy filesystem scan
      # ------------------------------------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ------------------------------------------------------------
      # 7. Build Docker image
      # ------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t devsecops-app:latest .

      # ------------------------------------------------------------
      # 8. Trivy container scan
      # ------------------------------------------------------------
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignorefile: .trivyignore
          exit-code: 1

      # ------------------------------------------------------------
      # 9. DEBUG GITHUB OIDC
      #
      # This is intentionally BEFORE configure-aws-credentials.
      #
      # It obtains the real GitHub OIDC JWT and prints ONLY
      # non-sensitive claims. The JWT itself is never printed.
      # ------------------------------------------------------------
      - name: Debug GitHub OIDC
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -e

          echo "=========================================="
          echo "GitHub Actions OIDC Diagnostics"
          echo "=========================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref:        $GITHUB_REF"
          echo "Event:      $GITHUB_EVENT_NAME"
          echo "Workflow:   $GITHUB_WORKFLOW"
          echo "Actor:      $GITHUB_ACTOR"

          echo ""
          echo "Requesting GitHub OIDC token..."

          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not obtain GitHub OIDC token"
            exit 1
          fi

          echo "OIDC token successfully obtained."
          echo "Token length: ${#TOKEN}"

          echo ""
          echo "Decoding non-sensitive OIDC claims..."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add base64 padding if necessary
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          if [ -z "$CLAIMS" ]; then
            echo "::error::Could not decode OIDC token payload"
            exit 1
          fi

          echo ""
          echo "OIDC claims:"
          echo "$CLAIMS" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            repository_id,
            repository_visibility,
            ref,
            sha,
            event_name,
            actor,
            workflow,
            job_workflow_ref
          }'

          echo ""
          echo "Expected IAM trust values:"
          echo "aud = sts.amazonaws.com"
          echo "sub = repo:Shaurya-Chauhan-16/devsecops-pipeline:ref:refs/heads/main"

      # ------------------------------------------------------------
      # 10. Configure AWS credentials using GitHub OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions
          audience: sts.amazonaws.com

      # ------------------------------------------------------------
      # 11. Verify AWS identity
      # ------------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # 12. Login to Amazon ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # 13. Tag Docker image
      # ------------------------------------------------------------
      - name: Tag Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag devsecops-app:latest \
            $REGISTRY/${ECR_REPOSITORY}:latest

      # ------------------------------------------------------------
      # 14. Push image to ECR
      # ------------------------------------------------------------
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $REGISTRY/${ECR_REPOSITORY}:latest

      # ------------------------------------------------------------
      # 15. OWASP ZAP scan
      # ------------------------------------------------------------
      - name: Run OWASP ZAP
        run: |
          echo "OWASP ZAP scan configuration goes here."
          echo "Replace this with your existing ZAP scan command."

