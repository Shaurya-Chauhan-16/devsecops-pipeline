```yaml
name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. SAST - Bandit
      - name: Bandit security scan
        run: |
          bandit -r app/

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t devsecops-app .

      # 6. Start application container
      - name: Start application
        run: |
          docker run -d \
            --name devsecops-test \
            -p 5001:5001 \
            devsecops-app

      # 7. Wait for application
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:5001/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          docker logs devsecops-test
          exit 1

      # 8. DAST - OWASP ZAP
      - name: OWASP ZAP security scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:5001"

      # 9. Stop application container
      - name: Stop application
        if: always()
        run: |
          docker stop devsecops-test || true

      # 10. Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      # 11. Container security scan - Trivy
      - name: Trivy container scan
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            devsecops-app
```
